# CareFlow CI: Python, Node and security gates. Ubuntu runners only (private repo on GitHub Free,
# ~2,000 Actions minutes a month). Every action is pinned to a full commit SHA.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    # `labeled`: adding the `e2e` label runs the journeys on the PR (the e2e job below).
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      journeys_only:
        description: "Run only the e2e journeys (repeat runs, M2-12)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_SCANNER_VERSION: "2.6.0"
  OSV_SCANNER_SHA256: "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108"
  OASDIFF_VERSION: "1.32.1"
  OASDIFF_SHA256: "7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f"

jobs:
  python:
    if: ${{ !inputs.journeys_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: make install-py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Postgres image (pgvector + pg_textsearch; never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/postgres
          tags: careflow-postgres:ci
          load: true
          push: false
          cache-from: type=gha,scope=careflow-postgres
          cache-to: type=gha,scope=careflow-postgres,mode=max
      - name: Start Postgres (throwaway CI credentials)
        run: |
          docker run -d --name careflow-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=ci-postgres-pw -e CAREFLOW_DB_MIGRATOR_PASSWORD=ci-migrator-pw \
            -e CAREFLOW_DB_APP_PASSWORD=ci-app-pw -e HAPI_DB_PASSWORD=ci-hapi-pw \
            careflow-postgres:ci postgres -c shared_preload_libraries=pg_textsearch
          for _ in $(seq 1 60); do
            docker exec careflow-pg pg_isready -h 127.0.0.1 -U postgres -d careflow && exit 0
            sleep 2
          done
          docker logs careflow-pg
          exit 1
      - name: Start Valkey (the event bus, M1-11; the same image as infra/docker-compose.yml)
        run: |
          docker run -d --name careflow-valkey -p 6379:6379 \
            valkey/valkey:8.1.10@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
          for _ in $(seq 1 30); do
            docker exec careflow-valkey valkey-cli ping && exit 0
            sleep 1
          done
          docker logs careflow-valkey
          exit 1
      - name: Lint
        run: make lint-py
      - name: Typecheck
        run: make typecheck-py
      - name: Test
        run: make test-py
        env:
          CAREFLOW_REQUIRE_DB: "1"
          CAREFLOW_REQUIRE_REDIS: "1"
          REDIS_URL: redis://localhost:6379/0
          CAREFLOW_TEST_ADMIN_URL: postgresql+psycopg://postgres:ci-postgres-pw@localhost:5432/postgres
          DATABASE_URL: postgresql://careflow_app:ci-app-pw@localhost:5432/careflow
          DATABASE_URL_MIGRATOR: postgresql://careflow_migrator:ci-migrator-pw@localhost:5432/careflow

  node:
    if: ${{ !inputs.journeys_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: make install-node
      - name: Lint
        run: make lint-node
      - name: Typecheck
        run: make typecheck-node
      - name: Test
        run: make test-node

  contracts:
    if: ${{ !inputs.journeys_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch main for the breaking-change base
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install oasdiff (checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  oasdiff.tar.gz" | sha256sum -c -
          tar -xzf oasdiff.tar.gz oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install
        run: make install
      - name: Redocly lint, regenerate-and-diff, oasdiff breaking
        run: make contracts-check

  security:
    if: ${{ !inputs.journeys_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.14"
      - name: Install gitleaks and osv-scanner (checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          curl -fsSLo osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x gitleaks osv-scanner
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: gitleaks (full history)
        run: gitleaks git --redact --verbose --exit-code 1 .
      - name: osv-scanner (uv.lock and pnpm-lock.yaml)
        run: osv-scanner scan source --lockfile uv.lock --lockfile pnpm-lock.yaml
      - name: Banned and unconstrained dependencies
        run: uv run --no-project --python 3.12 python scripts/check_banned_deps.py

  e2e:
    # The journeys (M1-19, M2-12) on the real stack: the seven patient journeys, the three check-in
    # paths, the consent paths and the @ar variants. Postgres, Valkey and HAPI FHIR in Docker, the
    # API and the three apps from `make up`, every model reply replayed from e2e/replays (no model,
    # no key; no voice service, so the voice journeys are skipped with that reason). About a
    # quarter of an hour of the monthly minutes, so only on pushes to main, on PRs labelled `e2e`
    # and on demand (`journeys_only` skips the other jobs for repeat runs). Traces and videos of a
    # failed journey are uploaded.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E: "1"
      VOICE: "0"
      SEED_SYNTHEA: "0"
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Postgres image from the python job's cache (never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/postgres
          tags: careflow/postgres:17-pgvector0.8.6-pgts1.4.0
          load: true
          push: false
          cache-from: type=gha,scope=careflow-postgres
      - name: make up (Docker services, migrations, seed, API and apps; replayed models)
        run: make up
      - name: Install Chromium for Playwright
        run: pnpm --filter @careflow/e2e exec playwright install --with-deps chromium
      - name: make e2e
        run: make e2e
      - name: Upload the Playwright traces and the stack log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces
          path: |
            e2e/test-results/
            .run/stacks/careflow.log
          retention-days: 7
          if-no-files-found: ignore
      - name: make down
        if: always()
        run: make down
