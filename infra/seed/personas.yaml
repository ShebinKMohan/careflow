# Synthetic demo personas. Research prototype; synthetic data only; not for clinical use.
description: The seven synthetic demo personas (one per E2E journey). Read by the vitals simulator (M1-03), the
  eval scenarios (M1-18) and the E2E tests (M1-19, M2-12). Bundles in personas/<id>.json use PUT with fixed ids.
keypad_identifier_system: https://careflow.example/fhir/sid/keypad-id
personas:
- id: chest-pain
  fhir_patient_id: persona-chest-pain
  keypad_id: '100001'
  birth_date: '1968-03-14'
  sex: male
  scenario: Crushing chest pain radiating to the left arm with sweating, about an hour.
  language: en
  expected_rule: CHEST_PAIN_ECG_10MIN
- id: stroke
  fhir_patient_id: persona-stroke
  keypad_id: '100002'
  birth_date: '1955-06-02'
  sex: female
  scenario: Face droop, right arm weakness and slurred speech; last known well at 08:15.
  language: en
  expected_rule: FAST_STROKE
- id: child-drowsy
  fhir_patient_id: persona-child-drowsy
  keypad_id: '100003'
  birth_date: '2024-07-20'
  sex: male
  scenario: 2-year-old, hard to wake since this morning, fever last night; parent answers.
  language: en
  expected_rule: NG143_RED_FLAG
- id: sepsis
  fhir_patient_id: persona-sepsis
  keypad_id: '100004'
  birth_date: '1960-01-11'
  sex: male
  scenario: Fever, rigors and productive cough; kiosk vitals pulse 125, temp 39.4, SpO2 93 (partial NEWS2 6).
  language: en
  expected_rule: SEPSIS_NEWS2
- id: routine
  fhir_patient_id: persona-routine
  keypad_id: '100005'
  birth_date: '1992-04-18'
  sex: female
  scenario: 'Routine walk-in with an appointment today: improving sore throat for five days.'
  language: en
  expected_rule: null
- id: qr-phone
  fhir_patient_id: persona-qr-phone
  keypad_id: '100006'
  birth_date: '1997-02-09'
  sex: male
  scenario: Checks in at the kiosk, then continues on his phone through the QR hand-over.
  language: en
  expected_rule: null
- id: no-show
  fhir_patient_id: persona-no-show
  keypad_id: '100007'
  birth_date: '1981-05-23'
  sex: female
  scenario: Appointment today; called but does not come to the room within the grace window.
  language: en
  expected_rule: null
