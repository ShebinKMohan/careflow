# Ask the clinic (M2-09) over the handbook retrieval (M2-08). Research prototype; synthetic data only.
retrieval:
  # dense | bm25 | hybrid. Provisional: in a 14-question scratch check (not the eval), dense put the
  # right section first for 13 and hybrid for 9; both had it in the top 5 for all 14. The M2-08
  # retrieval eval (test phase) decides.
  mode: dense
  k: 5                 # chunks the answer may quote
  embedder: qwen       # qwen: Qwen3-Embedding-0.6B (the rag `embeddings` extra); hash: tests and CI only
ask:
  # A retrieve-only question whose best dense cosine is below this gets "I don't know" with no
  # model call. Provisional: in a 22-question scratch check (not the eval), clinic questions scored
  # 0.48 to 0.77 and unrelated ones 0.15 to 0.43. The M2-08 eval's cosine distribution replaces it.
  min_score: 0.45
  llm_timeout_s: 20    # each model call gets this long; a classify that times out refuses (fail safe)
  history_turns: 3     # answered turns kept per session, in the API's memory only
