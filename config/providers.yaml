# Which provider serves each AI task (docs/CONVENTIONS.md). One line per task: switching a task to
# another provider is a one-line change, e.g.
#   extraction: { provider: api, vendor: anthropic, model: <model id> }
# API providers are off unless the owner adds a key to .env; without it the task raises
# ProviderUnavailable and callers fall back to local/replay or mark the work not_run.
# The local model `qwen3.5-9b-4bit` is mlx-community/Qwen3.5-9B-MLX-4bit at revision
# 938d8919941c6e7efd3c7150eff7fe9d12afa631 (ADR-013), served only by scripts/with_llm.sh, which pins it.
tasks:
  conversation: { provider: local, model: qwen3.5-9b-4bit }
  extraction:   { provider: local, model: qwen3.5-9b-4bit }
  summary:      { provider: local, model: qwen3.5-9b-4bit }   # api is an optional override
  eval_judge:   { provider: cli,   tool: codex }   # offline only; fallback local; never the same model as the generator
  test_data:    { provider: cli,   tool: codex }   # offline only; or the coding agent writes the data in-session
  translation_check: { provider: local, model: qwen3.5-9b-4bit }   # offline only (M2-01); cli or api optional
speech:
  stt: { provider: mlx-whisper, by_language: { en: mlx-whisper, ar: mlx-whisper } }   # cohere-transcribe-arabic is gated on HF: use only if downloadable
  tts: { provider: kokoro, by_language: { en: kokoro, ar: mms-tts-ara } }   # Kokoro has no Arabic; SILMA cannot share numpy 2 (ADR-033)
  # When a spoken turn ends, per language (ADR-058, eval/speech/run_turns.py). Smart Turn v3 at 0.5
  # ended turns at the first 200 ms pause and split 30 of 261 English and 41 of 506 Arabic TTS-voiced
  # answers in two; silence alone splits 0 English at 400 ms and 3 Arabic at 700 ms.
  turn:
    en: { smart_turn: false, endpoint_silence_ms: 400 }
    ar: { smart_turn: false, endpoint_silence_ms: 700, hard_silence_ms: 1200 }
