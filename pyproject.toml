# CareFlow uv workspace root (virtual: no [project] table).
# Research prototype. Synthetic data only. Not for clinical use.

[tool.uv.workspace]
members = [
  "eval",
  "packages/contracts",
  "packages/providers",
  "services/api",
  "services/intake",
  "services/rules",
  "services/triage",
  "services/rag",
  "services/integration",
  "services/voice",
]

[dependency-groups]
dev = [
  "ruff==0.16.9",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "hypothesis==6.168.1",
  "datamodel-code-generator==0.83.0",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "pyyaml==6.0.3",
  "rfc3339-validator==0.1.4",
  "fhir.resources==8.3.0",
  "httpx==0.28.1",
  "respx==0.23.1",
  # Contract tests of the API against packages/contracts/openapi.yaml (M1-12).
  "schemathesis==4.28.0",
  # `make up` runs the API, the apps and the voice service with it (M1-19).
  "honcho==2.0.0",
  # chrF for the Arabic back-translation drift check (M2-01, scripts/i18n/backtranslate.py).
  "sacrebleu==2.6.0",
  # Local LLM server (Apple silicon only); scripts/with_llm.sh and `make llm-local` use it.
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# First-party packages live under packages/*/src and services/*/src.
src = ["packages/*/src", "services/*/src", "eval/src", "scripts"]
# Generated code is checked by `make contracts && git diff --exit-code`, not by the linter.
extend-exclude = [
  "**/node_modules", "**/.next", "**/dist", "**/generated", "**/careflow_contracts/api_models.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use literal fake secrets, and run the repo scripts as subprocesses.
"**/tests/**" = ["S101", "S105", "S106", "S107", "S603"]

[tool.pytest.ini_options]
# importlib mode lets every package keep a tests/test_import.py without name clashes.
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
testpaths = ["packages", "services", "scripts", "eval"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "requires_ktas: needs the real KTAS CSV in services/triage/data/raw (skipped when absent)",
  "live: needs a local model: mlx_lm.server (CAREFLOW_LIVE_LLM=1, scripts/with_llm.sh) or the voice models (CAREFLOW_LIVE_VOICE=1)",
  "hapi: needs HAPI FHIR seeded by `make up` (skipped when it does not answer)",
]
