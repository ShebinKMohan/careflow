# CareFlow uv workspace root (virtual: no [project] table).
# Research prototype. Synthetic data only. Not for clinical use.

[tool.uv.workspace]
members = [
  "packages/contracts",
  "packages/providers",
  "services/api",
  "services/intake",
  "services/rules",
  "services/triage",
  "services/rag",
  "services/integration",
]

[dependency-groups]
dev = [
  "ruff==0.16.9",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "hypothesis==6.168.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/node_modules", "**/.next", "**/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use literal fake secrets, and run the repo scripts as subprocesses.
"**/tests/**" = ["S101", "S105", "S106", "S603"]

[tool.pytest.ini_options]
# importlib mode lets every package keep a tests/test_import.py without name clashes.
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
testpaths = ["packages", "services", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
