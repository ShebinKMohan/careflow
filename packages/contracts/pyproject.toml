[project]
name = "careflow-contracts"
version = "0.0.0"
description = "Source of truth for CareFlow schemas: OpenAPI 3.1, JSON Schemas and the FHIR mapping table."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careflow_contracts"]
