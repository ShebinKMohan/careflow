webhooks:
  alert.raised:
    post:
      operationId: onAlertRaised
      summary: alert.raised event
      tags:
      - events
      description: A safety rule raised an alert for a session. No name, date of birth or free text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRaisedEvent'
            example:
              type: alert.raised
              timestamp: '2026-09-26T09:05:00Z'
              data:
                clinic_id: clinic_demo
                session_id: ses_chest_pain
                alert:
                  alert_id: alr_chest_pain
                  session_id: ses_chest_pain
                  rule_id: CHEST_PAIN_ECG_10MIN
                  ruleset_version: 2026.1.0
                  severity: critical
                  evidence_fact_ids:
                  - f_01M3EF2PM000000000035FW001
                  - f_01M3EF2PM000000000035FW003
                  - f_01M3EF2PM000000000035FW004
                  required_action: ecg_within_10_min
                  display_text: 'Chest pain: ECG within 10 minutes of arrival.'
                  partial: false
                  missing_inputs: []
                  raised_at: '2026-09-26T09:02:10Z'
                  deadline_at: '2026-09-26T09:10:00Z'
      responses:
        '204':
          description: Received. Any 2xx acknowledges delivery.
  triage.suggested:
    post:
      operationId: onTriageSuggested
      summary: triage.suggested event
      tags:
      - events
      description: A model suggested an urgency level; the nurse must still confirm it. Reasons are not included
        (model text). No name, date of birth or free text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageSuggestedEvent'
            example:
              type: triage.suggested
              timestamp: '2026-09-26T09:05:00Z'
              data:
                clinic_id: clinic_demo
                session_id: ses_chest_pain
                suggestion_id: sug_chest_pain
                level: 2
                scale: KTAS
                confidence: 0.71
                model_id: careflow-ktas-gbm
                model_version: 0.1.0
                created_at: '2026-09-26T09:04:00Z'
      responses:
        '204':
          description: Received. Any 2xx acknowledges delivery.
  triage.confirmed:
    post:
      operationId: onTriageConfirmed
      summary: triage.confirmed event
      tags:
      - events
      description: The nurse confirmed or overrode the urgency level; the level is now final. The override note
        is not included (free text). No name, date of birth or free text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageConfirmedEvent'
            example:
              type: triage.confirmed
              timestamp: '2026-09-26T09:05:00Z'
              data:
                clinic_id: clinic_demo
                session_id: ses_child_drowsy
                decision_id: dec_child_drowsy
                suggestion_id: sug_child_drowsy
                action: OVERRIDE
                final_level: 1
                scale: KTAS
                override_reason_code: clinical_judgement
                nurse_user_id: nurse_demo_01
                decided_at: '2026-09-26T09:06:00Z'
      responses:
        '204':
          description: Received. Any 2xx acknowledges delivery.
  token.called:
    post:
      operationId: onTokenCalled
      summary: token.called event
      tags:
      - events
      description: A queue token was called to a room. No name, date of birth or free text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCalledEvent'
            example:
              type: token.called
              timestamp: '2026-09-26T09:05:00Z'
              data:
                clinic_id: clinic_demo
                session_id: ses_chest_pain
                token_id: tok_chest_pain
                token_code: A-014
                department: emergency
                room: Resus 2
                called_at: '2026-09-26T09:08:00Z'
      responses:
        '204':
          description: Received. Any 2xx acknowledges delivery.
  token.no_show:
    post:
      operationId: onTokenNoShow
      summary: token.no_show event
      tags:
      - events
      description: A called token missed its grace window a second time (it was re-queued once
        after the first miss) and is now a no-show. No name, date of birth or free text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenNoShowEvent'
            example:
              type: token.no_show
              timestamp: '2026-09-26T09:40:00Z'
              data:
                clinic_id: clinic_demo
                session_id: ses_no_show
                token_id: tok_no_show
                token_code: G-032
                department: general
                marked_at: '2026-09-26T09:40:00Z'
      responses:
        '204':
          description: Received. Any 2xx acknowledges delivery.
  intake.completed:
    post:
      operationId: onIntakeCompleted
      summary: intake.completed event
      tags:
      - events
      description: The intake conversation finished and the structured facts are ready for the nurse. No name, date
        of birth or free text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeCompletedEvent'
            example:
              type: intake.completed
              timestamp: '2026-09-26T09:05:00Z'
              data:
                clinic_id: clinic_demo
                session_id: ses_routine
                extraction_status: complete
                completed_at: '2026-09-26T09:03:00Z'
      responses:
        '204':
          description: Received. Any 2xx acknowledges delivery.
  patient.feels_worse:
    post:
      operationId: onPatientFeelsWorse
      summary: patient.feels_worse event
      tags:
      - events
      description: The waiting patient pressed 'I feel worse' on their phone. The note stays in the API, never in
        the event. No name, date of birth or free text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientFeelsWorseEvent'
            example:
              type: patient.feels_worse
              timestamp: '2026-09-26T09:05:00Z'
              data:
                clinic_id: clinic_demo
                session_id: ses_routine
                flag_id: flg_routine_01
                reported_at: '2026-09-26T09:40:00Z'
                press_count: 1
                danger_answer_codes:
                - chest_pain
      responses:
        '204':
          description: Received. Any 2xx acknowledges delivery.
  nurse.flag:
    post:
      operationId: onNurseFlag
      summary: nurse.flag event
      tags:
      - events
      description: Something needs a nurse's attention, e.g. the phone assistant refused a medical question. No
        name, date of birth or free text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NurseFlagEvent'
            example:
              type: nurse.flag
              timestamp: '2026-09-26T09:05:00Z'
              data:
                clinic_id: clinic_demo
                session_id: ses_routine
                flag_id: flg_routine_02
                reason: medical_question
                raised_at: '2026-09-26T09:42:00Z'
      responses:
        '204':
          description: Received. Any 2xx acknowledges delivery.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      description: Opaque session id (never patient identity).
      schema: &id005
        $ref: ./schemas/fact.schema.json#/$defs/Identifier
      example: ses_chest_pain
    TokenId:
      name: token_id
      in: path
      required: true
      description: Opaque queue token id.
      schema: *id005
      example: tok_chest_pain
    TaskId:
      name: task_id
      in: path
      required: true
      description: Opaque task id.
      schema: *id005
      example: tsk_chest_pain_ecg
    Department:
      name: department
      in: path
      required: true
      description: Department id from config/rooms.yaml.
      schema: *id005
      example: emergency
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: A valid bearer token is required.
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: This role may not call this route.
    Notfound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not found
            status: 404
            detail: No such session.
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The session is not in a state that allows this.
    Unprocessablecontent:
      description: Unprocessable content
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable content
            status: 422
            detail: The request failed validation.
            errors:
            - loc: body.digits
              msg: String should match pattern '^[0-9]{6}$'
    BadRequest:
      description: The body is not valid JSON (or not the declared content type)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: There was an error parsing the body
    TooManyRequests:
      description: Too many attempts from this client or kiosk; wait and try again
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too many attempts. Please wait a minute and try again.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json). Never contains PHI.
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              loc:
                type: string
              msg:
                type: string
            required:
            - loc
            - msg
            additionalProperties: false
          description: Field-level validation errors (422 only).
      required:
      - title
      - status
      additionalProperties: false
    Role:
      type: string
      enum:
      - kiosk_device
      - patient_session
      - nurse
      - doctor
      - admin
      - board
      - integration
      description: Caller role carried in the JWT.
    StructuredFacts:
      $ref: ./schemas/structured-facts.schema.json#/$defs/StructuredFacts
    UrgencySuggestion:
      $ref: ./schemas/urgency-suggestion.schema.json#/$defs/UrgencySuggestion
    Alert:
      $ref: ./schemas/alert.schema.json#/$defs/Alert
    NurseDecision:
      $ref: ./schemas/nurse-decision.schema.json#/$defs/NurseDecision
    NeededFact:
      $ref: ./schemas/structured-facts.schema.json#/$defs/NeededFact
    Language:
      $ref: ./schemas/structured-facts.schema.json#/$defs/Language
    Provenance:
      $ref: ./schemas/fact.schema.json#/$defs/Provenance
    SourceRef:
      $ref: ./schemas/fact.schema.json#/$defs/SourceRef
    RuleId:
      $ref: ./schemas/alert.schema.json#/$defs/RuleId
    AlertSeverity:
      $ref: ./schemas/alert.schema.json#/$defs/AlertSeverity
    TriageScale:
      $ref: ./schemas/urgency-suggestion.schema.json#/$defs/TriageScale
    UrgencyLevel:
      $ref: ./schemas/urgency-suggestion.schema.json#/$defs/UrgencyLevel
    AcvpuCode:
      $ref: ./schemas/structured-facts.schema.json#/$defs/AcvpuCode
    FactKey:
      $ref: ./schemas/structured-facts.schema.json#/$defs/FactKey
    LoginRequest:
      type: object
      description: Staff login (dev users only; synthetic).
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
      required:
      - username
      - password
      additionalProperties: false
    DeviceTokenRequest:
      type: object
      description: A kiosk, queue-board device or integration service account (M4-01, M4-02) exchanges
        its provisioned secret for a token (roles kiosk_device, board or integration).
      properties:
        device_id: *id005
        device_type:
          type: string
          enum:
          - kiosk
          - board
          - integration
        device_secret:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
      required:
      - device_id
      - device_type
      - device_secret
      additionalProperties: false
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Seconds.
        role:
          $ref: '#/components/schemas/Role'
        clinic_id: *id005
      required:
      - access_token
      - token_type
      - expires_in
      - role
      - clinic_id
      additionalProperties: false
    Me:
      type: object
      properties:
        user_id: *id005
        role:
          $ref: '#/components/schemas/Role'
        clinic_id: *id005
        display_name:
          type: string
          maxLength: 64
      required:
      - user_id
      - role
      - clinic_id
      additionalProperties: false
    WsTicketRequest:
      type: object
      description: session_id is required for the session channel.
      properties:
        channel:
          type: string
          enum:
          - staff
          - session
        session_id: *id005
      required:
      - channel
      if:
        properties:
          channel:
            const: session
      then:
        required:
        - session_id
      additionalProperties: false
    WsTicket:
      type: object
      description: Single-use ticket, valid for 30 s. Connect with ?ticket=...
      properties:
        ticket:
          type: string
          minLength: 16
        channel:
          type: string
          enum:
          - staff
          - session
        session_id: *id005
        expires_at: &id006
          type: string
          format: date-time
      required:
      - ticket
      - channel
      - expires_at
      additionalProperties: false
    KeypadCheckinRequest:
      type: object
      properties:
        clinic_id: *id005
        kiosk_id: *id005
        digits:
          type: string
          pattern: ^[0-9]{6}$
          description: Keypad ID. Only ever in the body, never in a URL.
        language:
          $ref: '#/components/schemas/Language'
          description: The language the patient picked on the kiosk's first screen (M2-01). The session keeps it; it never changes mid-session. English when absent.
      required:
      - clinic_id
      - kiosk_id
      - digits
      additionalProperties: false
    IdTapCheckinRequest:
      type: object
      properties:
        clinic_id:
          $ref: ./schemas/fact.schema.json#/$defs/Identifier
        kiosk_id:
          $ref: ./schemas/fact.schema.json#/$defs/Identifier
        mock_card_payload:
          $ref: '#/components/schemas/MockCardPayload'
        language:
          $ref: '#/components/schemas/Language'
          description: The language the patient picked on the kiosk's first screen. English when
            absent.
      required:
      - clinic_id
      - kiosk_id
      - mock_card_payload
      additionalProperties: false
    MockCardPayload:
      type: object
      description: What the simulated ID reader sends (M2-05). Synthetic only; never a real ID.
      properties:
        card_type:
          type: string
          enum:
          - mock_national_id
        id_number:
          type: string
          pattern: ^784-[0-9]{4}-[0-9]{7}-[0-9]$
          description: A synthetic Emirates ID-style number (784-YYYY-NNNNNNN-C). Only ever in the
            body, never in a URL or a log (logs mask it).
      required:
      - card_type
      - id_number
      additionalProperties: false
    CheckinResult:
      type: object
      properties:
        session_id: *id005
        session_token:
          type: string
          description: Bearer JWT with role patient_session, scoped to this session.
        patient_display:
          type: string
          minLength: 1
          maxLength: 8
          description: Initials only, e.g. 'M. S.'.
        language:
          $ref: '#/components/schemas/Language'
        first_question:
          $ref: '#/components/schemas/IntakeQuestion'
      required:
      - session_id
      - session_token
      - patient_display
      - language
      additionalProperties: false
    IntakeQuestion:
      type: object
      description: The next thing the kiosk shows the patient (M1-13). `key` is the StructuredFacts
        path the question asks about, which picks the tap answers; null for a message the patient
        only acknowledges. `notice` is shown before the question (e.g. the nurse-coming message).
        Never a level, an alert or model output that did not pass the output filter (M1-07).
      properties:
        question_id: *id005
        text:
          type: string
          minLength: 1
          maxLength: 500
        key:
          oneOf:
          - type: string
            pattern: ^[a-z][a-z0-9_.]{0,63}$
          - type: 'null'
        notice:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 300
          - type: 'null'
        notice_kind:
          description: 'What the notice is (M2-10): the reply to a question the patient asked during the
            intake (`medical_refusal`, `clinic_answer`, `ask_on_phone`, `finish_first`), or the
            `nurse_coming` message; null without a notice. `ask_on_phone` tells the kiosk to highlight
            "Continue on your phone".'
          oneOf:
          - type: string
            enum:
            - nurse_coming
            - medical_refusal
            - clinic_answer
            - ask_on_phone
            - finish_first
          - type: 'null'
        citations:
          description: The handbook sections a `clinic_answer` notice cites (M2-10); null otherwise.
          oneOf:
          - type: array
            maxItems: 5
            items:
              $ref: '#/components/schemas/Citation'
          - type: 'null'
      required:
      - question_id
      - text
      - key
      additionalProperties: false
    QrToken:
      type: object
      description: One-time token shown as a QR code on the kiosk.
      properties:
        qr_token:
          type: string
          minLength: 16
        expires_at: *id006
      required:
      - qr_token
      - expires_at
      additionalProperties: false
    QrClaimRequest:
      type: object
      properties:
        qr_token:
          type: string
          minLength: 16
        claim_key:
          type: string
          pattern: ^[A-Za-z0-9_-]{43,128}$
          description: A random secret the phone makes once per code (32 or more random bytes,
            base64url) and never stores or puts in a URL. Sending the same code with the same key
            again proves the retry comes from the phone that claimed it.
      required:
      - qr_token
      additionalProperties: false
    SessionRenewal:
      type: object
      description: A new phone-channel patient token for the same session (M2-06).
      properties:
        session_token:
          type: string
          description: Bearer JWT with role patient_session and channel phone, scoped to this
            session.
        expires_at: *id006
      required:
      - session_token
      - expires_at
      additionalProperties: false
    ConsentRequest:
      type: object
      description: The kiosk's consent screen (M2-05). The camera is processed on the kiosk and never
        saved; voice is transcribed on the clinic server and no audio is kept; data use covers the
        answers going to the clinic team and the clinic record.
      properties:
        camera:
          type: boolean
        voice:
          type: boolean
        data_use:
          type: boolean
        consent_version:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$
          description: The version of the consent text the patient saw.
      required:
      - camera
      - voice
      - data_use
      - consent_version
      additionalProperties: false
    ConsentRecord:
      type: object
      properties:
        session_id: *id005
        camera:
          type: boolean
        voice:
          type: boolean
        data_use:
          type: boolean
        consent_version:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$
        recorded_at: *id006
      required:
      - session_id
      - camera
      - voice
      - data_use
      - consent_version
      - recorded_at
      additionalProperties: false
    PatientDetailsRequest:
      type: object
      description: Who the patient is. A child's age is required; months are the months beyond
        `age_years` and are asked when the child is under 2.
      properties:
        patient_type:
          type: string
          enum:
          - adult
          - child
        age_years:
          type: integer
          minimum: 0
          maximum: 15
        age_months:
          type: integer
          minimum: 0
          maximum: 11
      required:
      - patient_type
      additionalProperties: false
    PatientDetails:
      type: object
      properties:
        session_id: *id005
        patient_type:
          type: string
          enum:
          - adult
          - child
        age_years:
          type: integer
          minimum: 0
          maximum: 15
        age_months:
          type: integer
          minimum: 0
          maximum: 11
      required:
      - session_id
      - patient_type
      additionalProperties: false
    TurnRequest:
      type: object
      properties:
        expected_intake_revision:
          type: integer
          minimum: 0
          description: The opaque revision returned by session status or the previous accepted
            turn. A stale revision returns 409 without submitting the answer. Optional for older
            clients; clients must not calculate or increment it themselves.
        input_mode:
          type: string
          enum:
          - tap
          - text
          - voice
        text:
          type: string
          minLength: 1
          maxLength: 2000
        language:
          $ref: '#/components/schemas/Language'
      required:
      - input_mode
      - text
      - language
      additionalProperties: false
    TurnResponse:
      type: object
      properties:
        turn_id: *id005
        intake_revision:
          type: integer
          minimum: 0
          description: Opaque server revision after this accepted turn. Use this value unchanged
            as expected_intake_revision for the next answer.
        assistant_text:
          type: string
          maxLength: 2000
        done:
          type: boolean
        next_question:
          description: What to ask next; null when the conversation is done.
          oneOf:
          - $ref: '#/components/schemas/IntakeQuestion'
          - type: 'null'
      required:
      - turn_id
      - intake_revision
      - assistant_text
      - done
      additionalProperties: false
    SessionState:
      type: string
      enum:
      - intake
      - awaiting_nurse
      - queued
      - called
      - arrived
      - no_show
      - closed
    SessionStatus:
      type: object
      description: What the patient may see. Never a level or an alert.
      properties:
        state:
          $ref: '#/components/schemas/SessionState'
        intake_revision:
          type: integer
          minimum: 0
          description: Opaque server revision of the intake, read together with the pending
            question. It can advance even when the question id is unchanged. Use it unchanged
            as expected_intake_revision when answering; never calculate it locally.
        current_question:
          description: The pending patient question from the current intake. Omitted or null when
            the session is not in intake or is not waiting for a patient answer.
          oneOf:
          - $ref: '#/components/schemas/IntakeQuestion'
          - type: 'null'
        token_code:
          type: string
        room:
          type: string
        wait_estimate_min:
          type: integer
          minimum: 0
        vitals:
          $ref: '#/components/schemas/LatestVitals'
      required:
      - state
      - intake_revision
      additionalProperties: false
    LatestVitals:
      type: object
      description: The latest device readings, for the kiosk vitals panel. Numbers only; never a level
        or an alert.
      properties:
        heart_rate:
          type: number
          minimum: 0
          description: /min
        spo2:
          type: number
          minimum: 0
          maximum: 100
          description: '%'
        temperature_c:
          type: number
          description: Cel
        systolic_bp:
          type: number
          minimum: 0
          description: mm[Hg]
        diastolic_bp:
          type: number
          minimum: 0
          description: mm[Hg]
        measured_at:
          type: string
          format: date-time
        device_id:
          $ref: ./schemas/fact.schema.json#/$defs/Identifier
        simulated:
          type: boolean
          description: True when the reading comes from the simulated device (M1-03).
      required:
      - measured_at
      - device_id
      - simulated
      additionalProperties: false
    VitalsScenario:
      type: string
      description: A simulated vitals scenario (services/api/src/careflow_api/devices/scenarios).
      enum:
      - normal
      - septic
      - hypoxic
      - tachycardic_child
    VitalsSimRequest:
      type: object
      properties:
        scenario:
          $ref: '#/components/schemas/VitalsScenario'
      additionalProperties: false
    VitalsSimStarted:
      type: object
      properties:
        session_id:
          $ref: ./schemas/fact.schema.json#/$defs/Identifier
        scenario:
          $ref: '#/components/schemas/VitalsScenario'
        frames:
          type: integer
          minimum: 1
          description: Readings the simulator will send.
        simulated:
          type: boolean
          const: true
      required:
      - session_id
      - scenario
      - frames
      - simulated
      additionalProperties: false
    DeviceVitalsReading:
      type: object
      description: One reading from the (simulated) vitals device.
      properties:
        device_id: *id005
        reading_id: *id005
        measured_at: *id006
        heart_rate:
          type: number
          minimum: 0
          description: /min
        spo2:
          type: number
          minimum: 0
          maximum: 100
          description: '%'
        temperature_c:
          type: number
          description: Cel
        systolic_bp:
          type: number
          minimum: 0
          description: mm[Hg]
        diastolic_bp:
          type: number
          minimum: 0
          description: mm[Hg]
      required:
      - device_id
      - reading_id
      - measured_at
      additionalProperties: false
    VitalsAccepted:
      type: object
      properties:
        session_id: *id005
        fact_ids:
          type: array
          items:
            $ref: ./schemas/fact.schema.json#/$defs/FactId
      required:
      - session_id
      - fact_ids
      additionalProperties: false
    NurseVitalsRequest:
      type: object
      description: Nurse-entered vitals that complete the NEWS2.
      properties:
        respiratory_rate:
          type: number
          minimum: 0
          description: /min -> vitals.respiratory_rate
        systolic_bp:
          type: number
          minimum: 0
          description: mm[Hg] -> vitals.systolic_bp
        acvpu:
          $ref: '#/components/schemas/AcvpuCode'
        on_supplemental_o2:
          type: boolean
          description: -> vitals.on_supplemental_o2 (yes/no)
      additionalProperties: false
      minProperties: 1
    SessionWarning:
      type: string
      description: 'Why the nurse should double-check a session: extraction failed validation twice (extraction_incomplete), the EHR could not be read at check-in (ehr_unavailable), or the intake ended before its questions were done (intake_stopped_early).'
      enum:
      - extraction_incomplete
      - ehr_unavailable
      - intake_stopped_early
    News2Subscores:
      type: object
      description: The 0-3 subscore of each NEWS2 parameter that was measured.
      properties:
        respiratory_rate:
          type: integer
          minimum: 0
          maximum: 3
        spo2:
          type: integer
          minimum: 0
          maximum: 3
        systolic_bp:
          type: integer
          minimum: 0
          maximum: 3
        heart_rate:
          type: integer
          minimum: 0
          maximum: 3
        acvpu:
          type: integer
          minimum: 0
          maximum: 3
        temperature_c:
          type: integer
          minimum: 0
          maximum: 3
        on_supplemental_o2:
          type: integer
          minimum: 0
          maximum: 3
      additionalProperties: false
    News2Score:
      type: object
      description: NEWS2 (RCP 2017) from the latest vitals, as the rules engine scored it. Partial until all seven parameters are present, and never shown as a full score while partial.
      properties:
        total:
          type: integer
          minimum: 0
          maximum: 20
        subscores:
          $ref: '#/components/schemas/News2Subscores'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/FactKey'
        partial:
          type: boolean
        any_single_3:
          type: boolean
        risk_band:
          type: string
          enum:
          - low
          - low-medium
          - medium
          - high
      required:
      - total
      - subscores
      - missing
      - partial
      - any_single_3
      - risk_band
      additionalProperties: false
    TriageStatus:
      type: string
      enum:
      - awaiting_nurse
      - confirmed
    TriageView:
      type: object
      properties:
        session_id: *id005
        status:
          $ref: '#/components/schemas/TriageStatus'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        suggestion:
          oneOf:
          - $ref: '#/components/schemas/UrgencySuggestion'
          - type: 'null'
        needed_facts:
          type: array
          items:
            $ref: '#/components/schemas/NeededFact'
        decision:
          $ref: '#/components/schemas/NurseDecision'
        news2:
          description: Null when NEWS2 does not apply (under 16) or no vitals exist yet.
          oneOf:
          - $ref: '#/components/schemas/News2Score'
          - type: 'null'
        open_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        tasks:
          description: Every task of the session, completed ones included (M2-07), so a card read
            again after "ECG done" still shows it done.
          type: array
          items:
            $ref: '#/components/schemas/Task'
        warnings:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SessionWarning'
        feels_worse:
          $ref: '#/components/schemas/FeelsWorseSummary'
      required:
      - session_id
      - status
      - alerts
      - suggestion
      additionalProperties: false
    TaskKind:
      type: string
      enum:
      - ecg_within_10_min
    Task:
      type: object
      properties:
        task_id: *id005
        session_id: *id005
        kind:
          $ref: '#/components/schemas/TaskKind'
        status:
          type: string
          enum:
          - open
          - completed
        due_at: *id006
        completed_at: *id006
        completed_by: *id005
      required:
      - task_id
      - session_id
      - kind
      - status
      additionalProperties: false
    DecisionResult:
      type: object
      description: The final level and the queue token it produced.
      properties:
        decision:
          $ref: '#/components/schemas/NurseDecision'
        token:
          oneOf:
          - $ref: '#/components/schemas/QueueToken'
          - type: 'null'
      required:
      - decision
      - token
      additionalProperties: false
    AlertChip:
      type: object
      properties:
        alert_id: *id005
        rule_id:
          $ref: '#/components/schemas/RuleId'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        partial:
          type: boolean
        raised_at:
          description: When the rule first raised it (M2-07). A confirmed session shows a banner
            again for an alert raised after the nurse's decision.
          type: string
          format: date-time
      required:
      - alert_id
      - rule_id
      - severity
      - partial
      additionalProperties: false
    FeelsWorseSummary:
      type: object
      description: A waiting patient's "I feel worse" presses (M2-07), for the nurse. The note is the
        patient's own words from the latest press that had one; it is never put in an event.
      properties:
        press_count:
          type: integer
          minimum: 1
        last_reported_at:
          type: string
          format: date-time
        danger_answer_codes:
          type: array
          description: The latest press's answers.
          items:
            $ref: '#/components/schemas/DangerAnswerCode'
        note:
          type: string
          maxLength: 280
      required:
      - press_count
      - last_reported_at
      - danger_answer_codes
      additionalProperties: false
    WorklistItem:
      type: object
      properties:
        session_id: *id005
        patient_display:
          type: string
          maxLength: 8
        arrived_at: *id006
        state:
          $ref: '#/components/schemas/SessionState'
        token_code:
          type: string
        queue_token:
          description: The session's queue token (M2-07), for the nurse's queue controls (call,
            arrived, no-show, close).
          $ref: '#/components/schemas/QueueToken'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertChip'
        suggested_level:
          $ref: '#/components/schemas/UrgencyLevel'
        confirmed_level:
          $ref: '#/components/schemas/UrgencyLevel'
        decided_at:
          description: When the nurse confirmed or overrode the level (M2-07); absent before.
          type: string
          format: date-time
        scale:
          $ref: '#/components/schemas/TriageScale'
        open_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        age_years:
          type: integer
          minimum: 0
          maximum: 130
        sex:
          type: string
          description: Administrative gender (http://hl7.org/fhir/administrative-gender).
          enum:
          - male
          - female
          - other
          - unknown
        complaint:
          type: string
          maxLength: 80
          description: The chief complaint, short. Staff screens only.
        feels_worse:
          $ref: '#/components/schemas/FeelsWorseSummary'
        medical_questions:
          type: array
          maxItems: 20
          description: Medical questions the patient asked on the phone (M2-09), refused and flagged
            to the nurse, newest first. Staff screens only; deleted when the session closes.
          items:
            $ref: '#/components/schemas/MedicalQuestion'
        warnings:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SessionWarning'
      required:
      - session_id
      - patient_display
      - arrived_at
      - state
      - alerts
      - open_tasks
      additionalProperties: false
    MedicalQuestion:
      type: object
      description: A refused medical question, for the nurse (M2-09). The patient got the fixed refusal,
        never an answer.
      properties:
        flag_id: *id005
        question:
          type: string
          minLength: 1
          maxLength: 500
        language:
          $ref: '#/components/schemas/Language'
        asked_at: *id006
      required:
      - flag_id
      - question
      - language
      - asked_at
      additionalProperties: false
    Worklist:
      type: array
      items:
        $ref: '#/components/schemas/WorklistItem'
    QueueTokenStatus:
      type: string
      enum:
      - waiting
      - called
      - arrived
      - no_show
      - closed
    QueueToken:
      type: object
      properties:
        token_id: *id005
        session_id: *id005
        token_code:
          type: string
          pattern: ^[A-Z]-[0-9]{3}$
        department: *id005
        room:
          type: string
          maxLength: 32
        status:
          $ref: '#/components/schemas/QueueTokenStatus'
        issued_at: *id006
        called_at: *id006
        grace_until:
          type: string
          format: date-time
          description: No-show grace window end.
      required:
      - token_id
      - session_id
      - token_code
      - department
      - status
      - issued_at
      additionalProperties: false
    BoardEntry:
      type: object
      description: Only what a public board may show.
      properties:
        token_code:
          type: string
          pattern: ^[A-Z]-[0-9]{3}$
        room:
          oneOf:
          - type: string
            maxLength: 32
          - type: 'null'
        status:
          $ref: '#/components/schemas/QueueTokenStatus'
      required:
      - token_code
      - room
      - status
      additionalProperties: false
    Board:
      type: array
      items:
        $ref: '#/components/schemas/BoardEntry'
    CallNextResult:
      type: object
      description: token is null when nobody is waiting.
      properties:
        token:
          oneOf:
          - $ref: '#/components/schemas/QueueToken'
          - type: 'null'
      required:
      - token
      additionalProperties: false
    DoctorSessionSummary:
      type: object
      properties:
        session_id: *id005
        token_code:
          type: string
        arrived_at: *id006
        confirmed_level:
          $ref: '#/components/schemas/UrgencyLevel'
        scale:
          $ref: '#/components/schemas/TriageScale'
        alert_chips:
          type: array
          items:
            $ref: '#/components/schemas/AlertChip'
      required:
      - session_id
      - token_code
      - arrived_at
      - confirmed_level
      - scale
      - alert_chips
      additionalProperties: false
    DoctorSessions:
      type: array
      items:
        $ref: '#/components/schemas/DoctorSessionSummary'
    BriefingSectionId:
      type: string
      description: 'The briefing''s fixed sections, always in this order: alerts and triage, presenting complaint, danger-screen answers, vitals and NEWS2, record (EHR), model output, data quality.'
      enum:
      - alerts_triage
      - presenting_complaint
      - danger_screens
      - vitals_news2
      - record
      - model_output
      - data_quality
    BriefingItem:
      type: object
      description: 'Safety rule 4: every item carries its provenance and source. The text comes from fixed templates over structured values, never from a model. A patient''s words are in the transcript_span source''s quote.'
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        provenance:
          $ref: '#/components/schemas/Provenance'
        source:
          $ref: '#/components/schemas/SourceRef'
        fact_id:
          $ref: ./schemas/fact.schema.json#/$defs/FactId
        recorded_at:
          type: string
          format: date-time
          description: When the fact was recorded (a device reading, a nurse's entry, an EHR read, the patient's answer), or when the nurse decided.
        source_missing:
          type: boolean
          description: True when the item's source failed the briefing check. Screens show "source missing" in red; it is logged as an error, and the tests require that no item has it.
      required:
      - text
      - provenance
      - source
      - recorded_at
      additionalProperties: false
    BriefingNoteCode:
      type: string
      description: 'What a note says: a data-quality warning (extraction_incomplete, intake_stopped_early, ehr_unavailable, ehr_partial, facts_dropped), no model suggestion (suggestion_unavailable), NEWS2 not applicable under 16 (news2_not_applicable), or nothing of a section''s kind was recorded (none_recorded).'
      enum:
      - extraction_incomplete
      - intake_stopped_early
      - ehr_unavailable
      - ehr_partial
      - facts_dropped
      - suggestion_unavailable
      - news2_not_applicable
      - none_recorded
    BriefingNote:
      type: object
      description: A fixed line about the briefing itself, not about the patient, so it has no provenance. Data-quality warnings, and a section where nothing of its kind was recorded, are notes.
      properties:
        code:
          $ref: '#/components/schemas/BriefingNoteCode'
        text:
          type: string
          minLength: 1
          maxLength: 300
        count:
          type: integer
          minimum: 0
          description: How many, for facts_dropped.
      required:
      - code
      - text
      additionalProperties: false
    BriefingSection:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/BriefingSectionId'
        title:
          type: string
          minLength: 1
          maxLength: 80
        items:
          type: array
          items:
            $ref: '#/components/schemas/BriefingItem'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/BriefingNote'
      required:
      - id
      - title
      - items
      additionalProperties: false
    BriefingSentence:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 400
        fact_ids:
          type: array
          description: The facts this sentence rephrases. Every id must be an item's fact_id.
          items:
            $ref: ./schemas/fact.schema.json#/$defs/FactId
          minItems: 1
          maxItems: 20
          uniqueItems: true
      required:
      - text
      - fact_ids
      additionalProperties: false
    BriefingSummary:
      type: object
      description: 'An optional model summary that may only rephrase cited items. The whole summary is dropped when any sentence cites no fact or an unknown fact, has a number that is not in its cited items, or reads as a diagnosis or advice (safety rule 2).'
      properties:
        sentences:
          type: array
          items:
            $ref: '#/components/schemas/BriefingSentence'
          minItems: 1
          maxItems: 5
      required:
      - sentences
      additionalProperties: false
    SummaryStatus:
      type: string
      description: 'ok: a checked summary is attached. dropped: the model''s summary failed the check and was discarded. disabled: summaries are switched off, or the summary provider is unavailable. The plain list is always complete.'
      enum:
      - ok
      - dropped
      - disabled
    DecisionAction:
      $ref: ./schemas/nurse-decision.schema.json#/$defs/DecisionAction
    OverrideReasonCode:
      $ref: ./schemas/nurse-decision.schema.json#/$defs/OverrideReasonCode
    BriefingSuggestion:
      type: object
      description: The urgency model's suggestion. Only a suggestion; the nurse's level is in confirmed.
      properties:
        level:
          $ref: '#/components/schemas/UrgencyLevel'
        scale:
          $ref: '#/components/schemas/TriageScale'
        display_label:
          type: string
          minLength: 1
          maxLength: 40
        confidence:
          type: number
          minimum: 0
          maximum: 1
        model_id:
          $ref: ./schemas/fact.schema.json#/$defs/Identifier
        model_version:
          $ref: ./schemas/fact.schema.json#/$defs/Identifier
      required:
      - level
      - scale
      - confidence
      - model_id
      - model_version
      additionalProperties: false
    BriefingConfirmation:
      type: object
      description: The level the nurse confirmed or set (safety rule 3).
      properties:
        level:
          $ref: '#/components/schemas/UrgencyLevel'
        scale:
          $ref: '#/components/schemas/TriageScale'
        action:
          $ref: '#/components/schemas/DecisionAction'
        nurse_user_id:
          $ref: ./schemas/fact.schema.json#/$defs/Identifier
        decided_at:
          type: string
          format: date-time
      required:
      - level
      - scale
      - action
      - nurse_user_id
      - decided_at
      additionalProperties: false
    BriefingOverrideReason:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/OverrideReasonCode'
        note:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - code
      additionalProperties: false
    BriefingTriage:
      type: object
      description: The model's suggestion (null when there was none) always beside the nurse's decision.
      properties:
        suggested:
          oneOf:
          - $ref: '#/components/schemas/BriefingSuggestion'
          - type: 'null'
        confirmed:
          $ref: '#/components/schemas/BriefingConfirmation'
        override_reason:
          oneOf:
          - $ref: '#/components/schemas/BriefingOverrideReason'
          - type: 'null'
      required:
      - suggested
      - confirmed
      - override_reason
      additionalProperties: false
    BriefingVersions:
      type: object
      description: What produced the briefing. Null when that part did not run.
      properties:
        ruleset:
          oneOf:
          - type: string
            maxLength: 64
          - type: 'null'
          description: The safety ruleset version.
        model:
          oneOf:
          - $ref: ./schemas/fact.schema.json#/$defs/Identifier
          - type: 'null'
          description: The urgency model version behind the suggestion.
        prompt:
          oneOf:
          - $ref: ./schemas/fact.schema.json#/$defs/Identifier
          - type: 'null'
          description: The summary prompt version, when a summary was asked for.
      required:
      - ruleset
      - model
      - prompt
      additionalProperties: false
    Briefing:
      type: object
      description: 'The doctor briefing (M1-16): seven fixed sections of sourced items, an optional checked summary, and the triage decision. Built after the nurse''s decision.'
      properties:
        session_id: *id005
        generated_at: *id006
        sections:
          type: array
          items:
            $ref: '#/components/schemas/BriefingSection'
          minItems: 7
          maxItems: 7
        summary:
          oneOf:
          - $ref: '#/components/schemas/BriefingSummary'
          - type: 'null'
        summary_status:
          $ref: '#/components/schemas/SummaryStatus'
        triage:
          $ref: '#/components/schemas/BriefingTriage'
        versions:
          $ref: '#/components/schemas/BriefingVersions'
      required:
      - session_id
      - generated_at
      - sections
      - summary
      - summary_status
      - triage
      - versions
      additionalProperties: false
    CompanionStatus:
      type: object
      description: The waiting room on the phone (M2-07), and the data of the `queue.status`
        WebSocket frame. Never a level or an alert.
      properties:
        state:
          $ref: '#/components/schemas/SessionState'
        position:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: 1 is next in the patient's department queue; null when not waiting.
        wait_estimate_minutes:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        token:
          oneOf:
          - $ref: '#/components/schemas/QueueToken'
          - type: 'null'
        room:
          oneOf:
          - type: string
            maxLength: 32
          - type: 'null'
        patient_type:
          type: string
          enum:
          - adult
          - child
          description: A parent's child session (M2-04) gets the child wording on the phone. Absent
            in `queue.status` frames.
      required:
      - state
      - position
      - wait_estimate_minutes
      - token
      - room
      additionalProperties: false
    FeelsWorseRequest:
      type: object
      properties:
        answers:
          $ref: '#/components/schemas/FeelsWorseAnswers'
        note:
          type: string
          maxLength: 280
          description: Optional; shown to the nurse, never put in events.
      required:
      - answers
      additionalProperties: false
    FeelsWorseAnswers:
      type: object
      description: The three quick danger questions of "I feel worse" (M2-07), as ticked items and a
        yes / no / not sure; never free text. An unticked item is not a "no".
      properties:
        chest_or_breathing:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            type: string
            enum:
            - chest_pain
            - short_of_breath
        face_arm_speech:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            type: string
            enum:
            - face_droop
            - arm_weakness
            - speech_difficulty
        drowsy_or_confused:
          type: string
          enum:
          - 'yes'
          - 'no'
          - not_sure
      required:
      - chest_or_breathing
      - face_arm_speech
      - drowsy_or_confused
      additionalProperties: false
    DangerAnswerCode:
      type: string
      description: One "I feel worse" answer, as a code (M2-07).
      enum:
      - chest_pain
      - short_of_breath
      - face_droop
      - arm_weakness
      - speech_difficulty
      - drowsy_or_confused
      - drowsy_or_confused_unsure
    FeelsWorseAck:
      type: object
      properties:
        flag_id:
          $ref: ./schemas/fact.schema.json#/$defs/Identifier
        received_at:
          type: string
          format: date-time
        press_count:
          type: integer
          minimum: 1
          description: How many times this session has pressed "I feel worse", this press included.
      required:
      - flag_id
      - received_at
      - press_count
      additionalProperties: false
    AskRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
        language:
          $ref: '#/components/schemas/Language'
      required:
      - question
      - language
      additionalProperties: false
    Citation:
      type: object
      properties:
        doc_id: *id005
        title:
          type: string
          maxLength: 200
        chunk_id: *id005
      required:
      - doc_id
      - title
      - chunk_id
      additionalProperties: false
    AskResponse:
      type: object
      description: 'Safety rule 2: never medical advice.'
      properties:
        answer:
          type: string
          maxLength: 2000
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        refused_medical:
          type: boolean
          description: 'True for a medical question: answer is the fixed safe message and the nurse is flagged.'
        dont_know:
          type: boolean
      required:
      - answer
      - citations
      - refused_medical
      - dont_know
      additionalProperties: false
    ProviderStatus:
      type: object
      properties:
        task:
          type: string
        provider:
          type: string
          enum:
          - local
          - api
          - cli
          - replay
        model:
          type: string
        tool:
          type: string
        available:
          type: boolean
        detail:
          type: string
          maxLength: 200
      required:
      - task
      - provider
      - available
      additionalProperties: false
    ProvidersResponse:
      type: object
