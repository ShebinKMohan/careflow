  /v1/companion/feels-worse:
    post:
      operationId: postFeelsWorse
      summary: I feel worse
      tags:
      - companion
      description: 'Safety feature: re-alerts the nurse immediately. Every press is stored and told
        to the nurse before anything else; the rules then run again. A visit that has ended (closed or
        a no-show) is a 409: the nurse station no longer shows it, so the phone tells the patient to
        go to the reception desk instead of saying the nurse was told.'
      x-careflow-roles:
      - patient_session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeelsWorseRequest'
            example:
              answers:
                chest_or_breathing:
                - chest_pain
                face_arm_speech: []
                drowsy_or_confused: 'no'
              note: My chest feels tight now.
