# CareFlow API contract (OpenAPI 3.1). Source of truth for routes, roles and bodies (ADR-002).
# Research prototype. Synthetic data only. Not for clinical use.
openapi: 3.1.0
info:
  title: CareFlow API
  version: 0.1.0
  summary: Triage check-in kiosk, nurse, doctor and companion API. Research prototype. Synthetic data only. Not
    for clinical use.
  description: Source of truth for routes, roles and bodies (ADR-002). Roles per operation are in `x-careflow-roles`.
    Errors are RFC 9457 problem details. Events are listed under `webhooks` and use the Standard Webhooks envelope
    (see events/README.md); the same envelope frames WebSocket messages (events/websocket.md). Patient identity
    never appears in a URL.
servers:
- url: http://localhost:8000
  description: Local development
security:
- bearerAuth: []
tags:
- name: health
  description: Liveness.
- name: auth
  description: Staff and device tokens.
- name: realtime
  description: WebSocket tickets.
- name: checkin
  description: Private check-in paths.
- name: consent
  description: Consent gate.
- name: intake
  description: Intake conversation and facts.
- name: vitals
  description: Device and nurse vitals.
- name: triage
  description: Alerts, suggestion and the nurse decision.
- name: nurse
  description: Nurse worklist and tasks.
- name: queue
  description: Tokens and rooms.
- name: board
  description: Public queue board.
- name: doctor
  description: Doctor sessions and briefing.
- name: companion
  description: Patient phone.
- name: admin
  description: Admin status.
- name: dev
  description: Development-only test hooks. They exist only when CAREFLOW_ENV=dev.
- name: events
  description: Outbound events (webhooks).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness
      tags:
      - health
      x-careflow-roles: []
      security: []
      responses:
        '200':
          description: Liveness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 0.1.0
                db: ok
                redis: ok
                fhir: down
  /v1/auth/login:
    post:
      operationId: login
      summary: Staff login
      tags:
      - auth
      x-careflow-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: nurse_demo_01
              password: dev-password-from-env
      responses:
        '200':
          description: Staff login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: example-access-token-nurse
                token_type: Bearer
                expires_in: 3600
                role: nurse
                clinic_id: clinic_demo
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessablecontent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/device-token:
    post:
      operationId: deviceToken
      summary: Kiosk or board device token
      tags:
      - auth
      x-careflow-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
            example:
              device_id: kiosk_01
              device_type: kiosk
              device_secret: dev-device-secret-from-env
      responses:
        '200':
          description: Kiosk or board device token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: example-access-token-kiosk
                token_type: Bearer
                expires_in: 43200
                role: kiosk_device
                clinic_id: clinic_demo
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessablecontent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/me:
    get:
      operationId: getMe
      summary: Who am I
      tags:
      - auth
      x-careflow-roles:
      - kiosk_device
      - patient_session
      - nurse
      - doctor
      - admin
      - board
      - integration
      responses:
        '200':
          description: Who am I
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                user_id: nurse_demo_01
                role: nurse
                clinic_id: clinic_demo
                display_name: Nurse Demo
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/ws-ticket:
    post:
      operationId: createWsTicket
      summary: One-time WebSocket ticket
      tags:
      - realtime
      description: Returns a single-use ticket valid for 30 s. Connect to /v1/ws/staff or /v1/ws/sessions/{session_id}
        with ?ticket=... . A JWT never goes in a URL or frame.
      x-careflow-roles:
      - kiosk_device
      - patient_session
      - nurse
      - doctor
      - board
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WsTicketRequest'
            example:
              channel: session
              session_id: ses_routine
      responses:
        '200':
          description: One-time WebSocket ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicket'
              example:
                ticket: ws-example-ticket-routine
                channel: session
                session_id: ses_routine
                expires_at: '2026-09-26T09:01:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessablecontent'
  /v1/checkin/keypad:
    post:
      operationId: checkinKeypad
      summary: Check in with the silent keypad
      tags:
      - checkin
      x-careflow-roles:
      - kiosk_device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeypadCheckinRequest'
            example:
              clinic_id: clinic_demo
              kiosk_id: kiosk_01
              digits: '100001'
      responses:
        '200':
          description: Check in with the silent keypad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResult'
              example:
                session_id: ses_chest_pain
                session_token: example-session-token-chest-pain
                patient_display: M. S.
                language: en
                first_question:
                  question_id: q_chief_complaint_1
                  text: What is the main reason for your visit today?
                  key: chief_complaint
                  notice: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Notfound'
        '422':
          $ref: '#/components/responses/Unprocessablecontent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/checkin/id-tap:
    post:
      operationId: checkinIdTap
      summary: Check in with the mock ID tap
      description: A simulated ID-card tap (M2-05), clearly a mock; never a real Emirates ID or UAE
        Pass. The card's synthetic id number is looked up as a Patient identifier on the FHIR
        server. One match starts a session exactly as the keypad does; none is a 404 that points
        the patient to the keypad; more than one is a 409 that sends them to reception. The id
        number travels only in this body and is logged masked.
      tags:
      - checkin
      x-careflow-roles:
      - kiosk_device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdTapCheckinRequest'
            example:
              clinic_id: clinic_demo
              kiosk_id: kiosk_01
              mock_card_payload:
                card_type: mock_national_id
                id_number: 784-1955-0000002-1
              language: en
      responses:
        '200':
          description: Check in with the mock ID tap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResult'
              example:
                session_id: ses_stroke
                session_token: example-session-token-stroke
                patient_display: F. A.
                language: en
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Notfound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessablecontent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/sessions/{session_id}/qr:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: issueQrToken
      summary: Issue a one-time QR hand-over token
      description: A 120-second, single-use token for this session (M2-06), signed with its own key;
        it carries no personal data. The kiosk shows it as
        `http://<companion>/claim#t=<qr_token>`, in the URL fragment so no browser sends it in a
        request. The kiosk's device token or the session's kiosk-channel patient token may ask; a
        phone token may not. A closed or already handed-over session is a 409.
      tags:
      - checkin
      x-careflow-roles:
      - kiosk_device
      - patient_session
      responses:
        '200':
          description: Issue a one-time QR hand-over token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrToken'
              example:
                qr_token: qr-example-token-routine
                expires_at: '2026-09-26T09:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Notfound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/checkin/qr/claim:
    post:
      operationId: claimQrToken
      summary: Claim the QR hand-over on the phone
      tags:
      - checkin
      description: The single-use qr_token in the body is the credential, so no bearer is needed
        (rate-limited to 10 claims a minute per IP). An expired, forged or wrong-audience token is a
        401; a spent token, or a closed or already handed-over session, is a 409. The result is a
        phone-channel patient token for that one session and the question the intake is waiting
        on; the kiosk's tokens for the session stop working and the kiosk receives the
        `session.handed_over` WebSocket frame. A phone whose claim succeeded but whose answer was
        lost sends the same qr_token with the same `claim_key` again, while the code is still
        valid, and gets a new credential for the session it claimed; a spent code without that
        key is still a 409.
      x-careflow-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrClaimRequest'
            example:
              qr_token: qr-example-token-routine
              claim_key: example-claim-key-for-docs-000000000000000000000000
      responses:
        '200':
          description: Claim the QR hand-over on the phone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResult'
              example:
                session_id: ses_routine
                session_token: example-session-token-routine
                patient_display: L. K.
                language: en
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessablecontent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/sessions/{session_id}/consent:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getConsent
      summary: The session's latest consent
      description: The latest consent record (M2-05); the voice service checks it before it opens
        the microphone stream. 404 when the session has none.
      tags:
      - consent
      x-careflow-roles:
      - patient_session
      responses:
        '200':
          description: The session's latest consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
              example:
                session_id: ses_routine
                camera: false
                voice: true
                data_use: true
                consent_version: 2026-09-27.1
                recorded_at: '2026-09-26T09:00:30Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Notfound'
    post:
      operationId: recordConsent
      summary: Record camera and voice consent
      description: Every POST appends a record; the latest wins (M2-05). Declining data use is
        recorded too, and the kiosk then sends the patient to reception.
      tags:
      - consent
      x-careflow-roles:
      - patient_session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
            example:
              camera: false
              voice: true
              data_use: true
              consent_version: 2026-09-27.1
      responses:
        '200':
          description: Record camera and voice consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
              example:
                session_id: ses_routine
                camera: false
                voice: true
                data_use: true
                consent_version: 2026-09-27.1
                recorded_at: '2026-09-26T09:00:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Notfound'
        '422':
          $ref: '#/components/responses/Unprocessablecontent'
  /v1/sessions/{session_id}/patient:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: setPatientDetails
      summary: Say who the patient is
      description: The kiosk's "Who is the patient?" answer (M2-04), once per session. For a child
        (under 16), the parent's stated age becomes PATIENT_STATED age facts, which replace an
        EHR age, and the intake asks the fixed child question bank. The same answer again is
        accepted; a different one is a conflict.
      tags:
      - intake
      x-careflow-roles:
      - patient_session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientDetailsRequest'
            example:
              patient_type: child
              age_years: 1
              age_months: 4
      responses:
        '200':
          description: Say who the patient is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetails'
              example:
                session_id: ses_routine
                patient_type: child
                age_years: 1
                age_months: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Notfound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessablecontent'
  /v1/sessions/{session_id}/turns:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postTurn
      summary: Send one intake turn
      description: When expected_intake_revision is supplied, it must match the current server
        revision or the answer is rejected with 409 without advancing the intake. Recover the
        current question and revision from session status before retrying an uncertain request.
      tags:
      - intake
      x-careflow-roles:
      - patient_session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
            example:
              input_mode: text
              text: I have had a sore throat for five days, it is getting better.
              language: en
      responses:
        '200':
          description: Send one intake turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponse'
              example:
                turn_id: turn_02
                intake_revision: 3
                assistant_text: Thank you. On a scale of 0 to 10, how bad is the pain?
                done: false
                next_question:
                  question_id: q_pain_score_1
                  text: Thank you. On a scale of 0 to 10, how bad is the pain?
                  key: pain_score
                  notice: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Notfound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessablecontent'
  /v1/sessions/{session_id}/facts:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getFacts
      summary: Structured facts for a session
      tags:
      - intake
      x-careflow-roles:
      - nurse
      - doctor
      responses:
        '200':
          description: Structured facts for a session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredFacts'
              example:
                session_id: ses_routine
                clinic_id: clinic_demo
                language: en
                patient:
                  fhir_patient_id: persona-routine
                  age_years:
                    fact_id: f_01M3EF2PM000000000035FW01Q
                    provenance: EHR
                    source:
                      kind: fhir
                      resource_type: Patient
                      id: persona-routine
                    recorded_at: '2026-09-26T09:00:00Z'
                    value: 34
                  sex:
                    fact_id: f_01M3EF2PM000000000035FW01R
                    provenance: EHR
                    source:
                      kind: fhir
                      resource_type: Patient
                      id: persona-routine
                    recorded_at: '2026-09-26T09:00:00Z'
                    value:
                      system: http://hl7.org/fhir/administrative-gender
                      code: female
                      display: Female
                chief_complaint:
                  fact_id: f_01M3EF2PM000000000035FW01S
                  provenance: PATIENT_STATED
                  source:
                    kind: transcript_span
                    turn_id: turn_01
                    start: 13
                    end: 60
                    quote: sore throat for five days, it is getting better
                  recorded_at: '2026-09-26T09:01:00Z'
                  value: Sore throat for five days, improving
                symptoms:
                - name:
                    fact_id: f_01M3EF2PM000000000035FW01T
                    provenance: PATIENT_STATED
                    source:
                      kind: transcript_span
                      turn_id: turn_01
                      start: 13
                      end: 24
                      quote: sore throat
                    recorded_at: '2026-09-26T09:01:00Z'
                    value: sore_throat
                  onset:
                    fact_id: f_01M3EF2PM000000000035FW01V
                    provenance: PATIENT_STATED
                    source:
                      kind: transcript_span
                      turn_id: turn_01
                      start: 25
                      end: 38
                      quote: for five days
                    recorded_at: '2026-09-26T09:01:00Z'
                    value: P5D
                  severity: mild
                pain_score:
                  fact_id: f_01M3EF2PM000000000035FW01W
                  provenance: PATIENT_STATED
                  source:
                    kind: transcript_span
                    turn_id: turn_02
                    start: 12
                    end: 21
                    quote: about a 2
                  recorded_at: '2026-09-26T09:01:00Z'
                  value: 2
                vitals:
                  heart_rate:
                    fact_id: f_01M3EF2PM000000000035FW01X
                    provenance: DEVICE_MEASURED
                    source:
                      kind: device
                      device_id: sim_vitals_01
                      reading_id: rd_0017
                    recorded_at: '2026-09-26T09:03:00Z'
                    value: 72
                    unit: /min
                  spo2:
                    fact_id: f_01M3EF2PM000000000035FW01Y
                    provenance: DEVICE_MEASURED
                    source:
                      kind: device
                      device_id: sim_vitals_01
                      reading_id: rd_0018
                    recorded_at: '2026-09-26T09:03:00Z'
                    value: 99
                    unit: '%'
                  temperature_c:
                    fact_id: f_01M3EF2PM000000000035FW01Z
                    provenance: DEVICE_MEASURED
                    source:
                      kind: device
                      device_id: sim_vitals_01
                      reading_id: rd_0019
                    recorded_at: '2026-09-26T09:03:00Z'
                    value: 36.7
                    unit: Cel
                  systolic_bp:
                    fact_id: f_01M3EF2PM000000000035FW020
                    provenance: DEVICE_MEASURED
                    source:
                      kind: device
                      device_id: sim_vitals_01
                      reading_id: rd_0020
                    recorded_at: '2026-09-26T09:03:00Z'
                    value: 118
                    unit: mm[Hg]
                  diastolic_bp:
                    fact_id: f_01M3EF2PM000000000035FW021
                    provenance: DEVICE_MEASURED
                    source:
                      kind: device
                      device_id: sim_vitals_01
                      reading_id: rd_0021
                    recorded_at: '2026-09-26T09:03:00Z'
                    value: 76
                    unit: mm[Hg]
                extraction_status: complete
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Notfound'
  /v1/sessions/{session_id}/status:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSessionStatus
      summary: Patient-safe session status
      tags:
      - intake
      description: Returns the pending patient question during intake so a reloaded client can
        resume from the server's current state. Never returns an urgency level or an alert.
      x-careflow-roles:
      - patient_session
      - kiosk_device
      responses:
        '200':
          description: Patient-safe session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
              example:
                state: queued
                intake_revision: 8
                token_code: G-031
                wait_estimate_min: 25
                vitals:
                  heart_rate: 78
                  spo2: 98
                  temperature_c: 36.8
                  measured_at: '2026-09-26T09:03:00Z'
                  device_id: sim_vitals_01
                  simulated: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Notfound'
  /v1/sessions/{session_id}/renew:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: renewSessionToken
      summary: Renew the phone's session token
      description: The phone swaps its still-valid phone-channel patient token (M2-06) for a new
        30-minute one while the patient waits, so a long wait does not shut them out of the waiting
        room or "I feel worse" (M2-07). Only a phone token of this session may renew (a kiosk-channel
        token or a device gets 403; an expired or revoked token 401). A closed or no-show session,
        or one checked in more than 12 hours ago, is a 409; the patient then asks at the desk.
      tags:
      - checkin
      x-careflow-roles:
      - patient_session
      responses:
        '200':
          description: Renew the phone's session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRenewal'
              example:
                session_token: example-session-token-renewed
                expires_at: '2026-09-26T09:35:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Notfound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sessions/{session_id}/vitals:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postDeviceVitals
      summary: Device vitals reading
      tags:
      - vitals
