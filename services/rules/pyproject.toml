[project]
name = "careflow-rules"
version = "0.0.0"
description = "CareFlow safety rules engine: pure Python, no I/O, no AI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "careflow-contracts",
  "pydantic>=2.13,<3",
]

[tool.uv.sources]
careflow-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careflow_rules"]
