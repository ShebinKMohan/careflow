[project]
name = "careflow-rules"
version = "0.0.0"
description = "CareFlow safety rules engine: pure Python, no I/O, no AI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careflow_rules"]
