[project]
name = "careflow-intake"
version = "0.1.0"
description = "CareFlow LangGraph intake graph."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "careflow-contracts",
  "careflow-providers",
  "careflow-rules",
  "langgraph==1.2.12",
  "langgraph-checkpoint-postgres>=3.1.2,<3.2",
  "psycopg[binary,pool]>=3.3,<3.4",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
]

[tool.uv.sources]
careflow-contracts = { workspace = true }
careflow-providers = { workspace = true }
careflow-rules = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careflow_intake"]
