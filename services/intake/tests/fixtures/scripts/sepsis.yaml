# Scripted synthetic patient (M1-07): an adult with fever and shivering, and the kiosk's readings
# from the M1-03 `septic` scenario (first point). A stated fever plus pulse 118 (2), SpO2 94 (1) and
# 39.2 C (2) give a partial NEWS2 of 5: SEPSIS_NEWS2, with the missing inputs asked of the nurse.
id: sepsis
description: Adult with fever and shivering; septic kiosk vitals.
session: {session_id: ses_script_sepsis, clinic_id: clinic_a, language: en}
device_facts:
  - {key: vitals.heart_rate, value: 118, unit: /min}
  - {key: vitals.spo2, value: 94, unit: "%"}
  - {key: vitals.temperature_c, value: 39.2, unit: Cel}
answers:
  chief_complaint: "I've had a fever and bad shivering for two days."
  infection.fever_reported: "Yes."
  infection.rigors: "Yes, I can't stop shaking."
  symptom_onset_at: "Two days ago."
  pain_score: "I don't really have any pain."
  severity: "About a six."
  allergies_confirm: "No allergies."
default_answer: "I'm not sure."
expect:
  alerts: [SEPSIS_NEWS2]
  partial: [SEPSIS_NEWS2]
  nurse_needed: [vitals.respiratory_rate, vitals.systolic_bp, vitals.acvpu, vitals.on_supplemental_o2]
  notice: true
  facts:
    infection.fever_reported: "yes"
  complete: true
  max_patient_turns: 8
