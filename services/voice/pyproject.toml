[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "plivo-voice-agent"
version = "0.1.0"
description = "In-house AI voice-call backend using Plivo bidirectional audio streaming."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2024.2.2",
  "fastapi>=0.116,<1.0",
  "google-genai>=1.0,<2.0",
  "httpx>=0.28,<1.0",
  "orjson>=3.10,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "redis>=5.2,<6.0",
  "uvicorn[standard]>=0.35,<1.0",
  "websockets>=14.2,<16.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]
# CPU-local speech stack (stt_provider=sherpa, tts_provider=kokoro). Model files are
# downloaded separately into models/ — see .env.example for the expected layout.
local-speech = [
  "kokoro-onnx>=0.5,<1.0",
  "numpy>=2.0,<3.0",
  "onnxruntime>=1.20,<2.0",
  "sherpa-onnx>=1.12,<2.0",
  "soxr>=0.5",
]

[project.scripts]
voice-agent = "voice_agent.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["kokoro_onnx.*", "sherpa_onnx.*", "soxr.*", "onnxruntime.*"]
ignore_missing_imports = true
