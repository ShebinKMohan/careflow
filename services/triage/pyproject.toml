[project]
name = "careflow-triage"
version = "0.0.0"
description = "CareFlow urgency model: training, evaluation, ONNX export and inference."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "careflow-contracts",
  "httpx>=0.28,<0.29",
  "joblib>=1.6,<2",
  "numpy>=2.3,<3",
  "openpyxl>=3.1,<4",
  "pandas>=3.0,<4",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.9,<1.10",
  "scipy>=1.18,<2",
  "shap>=0.52,<0.53",
  "threadpoolctl>=3.7,<4",
  "typer>=0.27,<0.28",
]

[project.optional-dependencies]
# Laya (M3-01): a ModernBERT-large decision model fine-tuned on KTAS on MPS. Apple silicon only,
# like the voice and embedding extras: torch's Linux wheels would pull the CUDA stack into the
# lock. The serializer (`laya_ktas.serialize`) never imports it, so CI and the API run without it.
laya = [
  "laya==0.3.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch>=2.8,<3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers>=5.17,<6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
careflow-triage = "careflow_triage.cli:main"

[tool.uv.sources]
careflow-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careflow_triage"]
