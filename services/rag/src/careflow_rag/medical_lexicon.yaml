# Layer A of the ask-the-clinic medical-question classifier (M2-09). A question that matches any
# entry here is medical, whatever the model says: the patient gets the fixed refusal and the nurse
# gets a flag (safety rule 2). Both languages are checked for every question, whatever the session
# language. When unsure, add the phrase: a false refusal costs the nurse a minute; a missed one
# could put medical advice in front of a patient. Research prototype; synthetic data only.
#
# Kept out on purpose, because they are everyday clinic logistics: "prescription", "pharmacy",
# "doctor", "nurse", "emergency" (the emergency department is in the handbook), "patient" and
# "مريض" (a patient), "scan" (the QR code), "tablet" (a device), the verb "treat" ("Do you treat
# children?"), and "go" or "wait" after "should I".
version: 1

en:
  # Regular expressions, matched case-insensitively on the question as whole words: each one is
  # wrapped in \b(?: ... )\b.
  symptoms:
    - symptoms?
    - pain(s|ful)?
    - ache[sd]?|aching
    - hurts?|hurting
    - sore
    - fever(ish)?|temperature
    - cough(s|ed|ing)?
    - (have|has|got|caught) (a )?(cold|flu)|flu
    - rash(es)?
    - itch(y|ing|es)?
    - swell(s|ed|ing)?|swollen
    - bleed(s|ing)?|blood(y)?
    - vomit(s|ed|ing)?|throw(ing)? up|threw up
    - nause(a|ous)
    - diarrh?(o)?ea
    - constipat(ed|ion)
    - dizz(y|iness)
    - faint(s|ed|ing)?|passed out|pass out|blacked out
    - headaches?|migraines?
    - breath(e|es|ing|less|lessness)?|short of breath
    - wheez(e|es|ed|ing|y)
    - palpitations?
    - chest
    - heart
    - strokes?
    - seizures?|convulsions?|epilep(sy|tic)
    - unconscious
    - numb(ness)?|tingl(e|es|ing)
    - weakness|feel(ing)? weak
    - infect(ion|ions|ed)
    - allerg(y|ies|ic)
    - asthma
    - diabet(es|ic)
    - blood (sugar|pressure)|sugar levels?
    - pregnan(t|cy)|miscarriage
    - injur(y|ies|ed)|fracture[sd]?|sprain(s|ed)?|broken (arm|leg|bone|wrist|ankle|finger|toe|rib|nose|hand|foot)
    - burn(s|ed|t)?
    - wounds?|bruis(e|es|ed|ing)
    - lumps?
    - cancer|tumou?rs?
    - covid|corona(virus)?|virus(es)?
    - sick|ill|illness|unwell|not feeling well|feel(ing)? (bad|worse|terrible|awful)
    - diseases?
    - swallow(ing)?
    - blurr(y|ed) vision|vision
  body_and_pain:
    - (stomach|tummy|belly|back|neck|ear|eye|tooth|throat|head|leg|arm|knee|foot|hand)(ache| ache| pain| hurts)
    - earache|toothache|sore throat|stomach ?ache|bellyache
  medicines:
    - medicines?|medications?|meds|drugs?|pills?|tablets|capsules?|syrups?|injections?|jabs?|vaccin(e|es|ation|ations)?
    - doses?|dosage|dosing|overdos(e|ed|es|ing)
    - antibiotics?|antihistamines?|steroids?|inhalers?|pain ?killers?|sleeping pills?|antidepressants?|opioids?
    - paracetamol|acetaminophen|panadol|tylenol|calpol|ibuprofen|advil|nurofen|brufen|aspirin|amoxicillin|augmentin|penicillin
    - insulin|metformin|codeine|morphine|tramadol|diclofenac|voltaren|naproxen|omeprazole|salbutamol|ventolin|prednisolone|cetirizine|loratadine|warfarin
  advice:
    - should (i|we|he|she|they|my \w+)( still| really)? (take|use|stop|start|eat|drink|worry|be worried|be concerned|see a doctor)
    - can (i|we|he|she|they|my \w+) (eat|drink)
    - (eat|drink) (anything|something) (before|while)
    - is (it|this|that) (serious|normal|dangerous|bad|contagious|infectious|urgent|an emergency|life[- ]threatening)
    - am i (sick|ill|dying|ok|okay|going to be ok|going to be okay|going to die)
    - will i (die|be ok|be okay|be fine|recover)
    - what('s| is) wrong with (me|my|him|her|them)
    - diagnos(e|ed|es|is|ing)
    - treatments?
    - cure[sd]?|remed(y|ies)
    - side[- ]effects?
    - (test|lab|blood|scan) results?
    - blood tests?|urine (test|sample)|lab tests?
    - ct scan|mri|x-?rays?|ultrasound|ecg|ekg|biopsy|stitches|surgery|operation (on|for)
    - how (much|many) (should|can|do) (i|we|he|she|they) (take|give)
    - what (should|can) (i|we) (take|do|give) (for|about)
    - first aid
    - worr(y|ied|ying) about (my|his|her|the) (health|symptoms?|child|baby|son|daughter|husband|wife|mother|father|mum|mom|dad)
  mental_health:
    - suicid(e|al)|kill (myself|himself|herself)|end my life|self[- ]harm|hurt(ing)? myself|want to die
    - depress(ed|ion)|anxiety|panic attacks?|mental health

